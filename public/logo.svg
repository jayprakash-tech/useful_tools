<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="toolboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a918b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f7571;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#toolboxGrad)" filter="url(#shadow)"/>
  
  <!-- Toolbox body -->
  <rect x="120" y="200" width="272" height="180" rx="20" fill="#ffffff" opacity="0.95"/>
  
  <!-- Toolbox handle -->
  <path d="M 180 200 L 180 170 Q 180 150 200 150 L 312 150 Q 332 150 332 170 L 332 200" 
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Tools peeking out -->
  <!-- Wrench -->
  <g transform="translate(160, 240) rotate(-15)">
    <rect x="0" y="0" width="60" height="12" rx="6" fill="#1f7571"/>
    <circle cx="60" cy="6" r="14" fill="none" stroke="#1f7571" stroke-width="8"/>
  </g>
  
  <!-- Code brackets -->
  <text x="256" y="300" font-family="monospace" font-size="48" font-weight="bold" fill="#1f7571" text-anchor="middle">&lt;/&gt;</text>
  
  <!-- Image icon -->
  <g transform="translate(300, 260)">
    <rect x="0" y="0" width="50" height="40" rx="6" fill="none" stroke="#1f7571" stroke-width="6"/>
    <circle cx="15" cy="15" r="6" fill="#1f7571"/>
    <path d="M 5 35 L 20 20 L 35 30 L 45 25 L 45 35 Z" fill="#1f7571" opacity="0.6"/>
  </g>
  
  <!-- Decorative shine -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="#ffffff" opacity="0.2"/>
</svg>
